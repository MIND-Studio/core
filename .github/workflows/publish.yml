name: Publish to GitHub Packages

# Publishes @mind-studio/core to GitHub Packages. Trigger by creating a GitHub
# Release (tag the version in package.json), or run manually. Note: @mind-studio/ui
# must already be published — core builds against it.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install (pulls @mind-studio/ui from GitHub Packages)
        run: npm install --no-package-lock
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: npm run build

      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
