name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      # Installs the @mind-studio/ui peer/dev dep from GitHub Packages via the
      # committed .npmrc. --no-package-lock avoids a stale-lock landmine while
      # the registry version is the source of truth. The `prepare` script then
      # runs the tsc build, so this also type-checks the package.
      - name: Install + build
        run: npm install --no-package-lock
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build (explicit)
        run: npm run build
